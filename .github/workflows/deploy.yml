name: Build and Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ASG_NAME: devops-app-asg

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get healthy instance IDs from ASG
        id: get_instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.ASG_NAME }}" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No running instances found in ASG ${{ env.ASG_NAME }}"
            exit 1
          fi

          echo "Found instances: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT

      - name: Deploy to each instance via SSM
        run: |
          for INSTANCE_ID in ${{ steps.get_instances.outputs.instance_ids }}; do
            echo "Deploying to $INSTANCE_ID ..."

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ${{ github.sha }}" \
              --parameters 'commands=[
                "cd /opt/app",
                "git fetch origin main",
                "git reset --hard origin/main",
                "pip3 install -r app/requirements.txt -q",
                "systemctl restart flask-app",
                "systemctl is-active flask-app && echo DEPLOY_OK"
              ]' \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            # Wait up to 60 seconds for the command to finish
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text)
              echo "  [$i] Status: $STATUS"
              if [ "$STATUS" = "Success" ]; then
                echo "Deployment succeeded on $INSTANCE_ID"
                break
              elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
                echo "Deployment FAILED on $INSTANCE_ID with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
              fi
            done
          done

      - name: Verify app is up
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names devops-app-alb \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          echo "Testing http://$ALB_DNS/health"
          for i in $(seq 1 6); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/health" || true)
            echo "  Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after retries"
          exit 1
